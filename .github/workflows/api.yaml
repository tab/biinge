name: API
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "api/**"
      - ".github/workflows/api.yaml"
  push:
    branches:
      - master
    paths:
      - "api/**"
      - ".github/workflows/api.yaml"
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  GO_ENV: test

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Format & lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum
      # Covers go vet and staticcheck too — .golangci.yaml enables govet and
      # staticcheck as linters, and gofmt and goimports as formatters
      - name: Format, style & correctness (golangci-lint)
        # NOTE: https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.3
          working-directory: api

  drift:
    # The spec, the schema dump and the sqlc output are hand-committed alongside
    # the change, so nothing but a diff catches one of them being left behind
    name: Contract & schema drift
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare against the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          ALLOW_SPEC_DRIFT: ${{ contains(github.event.pull_request.labels.*.name, 'contract-unchanged') && '1' || '' }}
        run: .github/scripts/contract-drift.sh "origin/$BASE"

  test:
    name: Tests & coverage
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biinge-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Load db/schema.sql into the test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d biinge-test -f db/schema.sql

      - name: Unit & integration tests (race detector, coverage)
        run: make test:race

      - name: Upload coverage to Codecov
        # NOTE: https://github.com/codecov/codecov-action/tree/v5.4.3
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: api
