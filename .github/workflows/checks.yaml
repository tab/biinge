name: Checks
on:
  # Title edits included: a title that passed can be edited into one that would
  # not, and nothing else would re-check it. Keep this workflow free of code
  # jobs so an edit cannot cancel one or publish a skipped status over its
  # result, which branch protection counts as a pass
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  conventions:
    # No path filter: these rules hold for every change, not just the api ones.
    # Dependabot writes its own titles and its own trailers, and neither is ours
    # to reword. Keyed on the author, not the actor: a human who reopens or
    # retitles one of its pull requests is the actor, and the title is still
    # Dependabot's. The .githooks copies catch this before the push, when installed
    name: Title & commits
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Title is a scoped Conventional Commit
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the title over the API, not out of the event payload: a re-run
          # replays the payload it was triggered with, so a corrected title
          # would never clear a failure here
          title="$(gh pr view "$NUMBER" --json title --jq .title)"

          if ! grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9.-]+\): [A-Z]' <<<"$title"; then
            echo "::error::the title needs a scoped Conventional Commit, capitalized after the colon. Got: $title"
            exit 1
          fi
          if grep -qE '\.$' <<<"$title"; then
            echo "::error::drop the trailing period from the title. Got: $title"
            exit 1
          fi

      - name: Commit messages carry no AI attribution
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          attribution='^[[:space:]]*co-authored-by:.*(claude|anthropic|copilot|chatgpt|codex|cursor)|^[[:space:]]*claude-session:|generated (with|by) .*(claude|anthropic|copilot|chatgpt|codex|cursor)|https://claude\.(ai|com)/|🤖'
          hits="$(git log --format='%H %s%n%b' "origin/$BASE..HEAD" \
            | grep -inE "$attribution" || true)"
          if [ -n "$hits" ]; then
            echo "::error::remove the AI tooling attribution from the commit messages"
            sed 's/^/  /' <<<"$hits"
            exit 1
          fi
