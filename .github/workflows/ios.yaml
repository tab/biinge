name: iOS
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yaml"
  push:
    branches:
      - master
    paths:
      - "ios/**"
      - ".github/workflows/ios.yaml"
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  check:
    name: Lint & tests
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.1"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          sudo install "$RUNNER_TEMP/swiftlint/swiftlint" /usr/local/bin/swiftlint
          swiftlint version

      - name: Doc comments & style (make lint)
        run: make lint SWIFTLINT_ARGS=--reporter=github-actions-logging

      - name: Unit tests (make test)
        run: make test
