name: Release
on:
  release:
    types: [ released ]
env:
  IMAGE_NAME: biinge-api
jobs:
  linter:
    name: Linter
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum
      - name: golangci-lint
        # NOTE: https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.3
          working-directory: api
  test:
    name: Test
    permissions:
      contents: read
    env:
      GO_ENV: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biinge-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum
      - name: Load schema.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d biinge-test -f db/schema.sql
      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

  build:
    name: Build
    needs: [linter, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        # NOTE: https://github.com/docker/setup-buildx-action/releases/tag/v3.11.1
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GitHub Container Registry
        # NOTE: https://github.com/docker/login-action/releases/tag/v3.4.0
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        # NOTE: https://github.com/docker/build-push-action/releases/tag/v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: api
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
      - name: Create GitHub Release
        # NOTE: https://github.com/softprops/action-gh-release/releases/tag/v2.3.2
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Release ${{ steps.version.outputs.value }}
          generate_release_notes: true

  migrate:
    name: Run Migrations
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    env:
      GO_ENV: production
      DATABASE_DSN: ${{ secrets.DATABASE_DSN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'api/go.mod'
          cache: true
          cache-dependency-path: api/go.sum
      - name: Install goose
        run: |
          if ! command -v goose &> /dev/null; then
            echo "Installing goose..."
            go install github.com/pressly/goose/v3/cmd/goose@latest
          else
            echo "goose is already installed"
          fi
      - name: Run database migrations
        run: |
          echo "Running database migrations for production..."
          export DATABASE_DSN="$DATABASE_DSN"
          GO_ENV=production make db:migrate
      - name: Verify migrations
        run: |
          echo "Checking migration status..."
          export DATABASE_DSN="$DATABASE_DSN"
          GO_ENV=production make db:migrate:status

  deploy:
    name: Deploy
    needs: migrate
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.DEPLOY_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull the released image
        run: docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
      - name: Restart the service
        run: docker compose -f "${{ secrets.COMPOSE_PATH }}" up -d biinge-api

  sentry:
    name: Sentry Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Sentry CLI
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Create Sentry release
        # release name matches APP_VERSION baked into the image, so events line up
        # set-commits --auto needs the Sentry GitHub integration; drop to --local otherwise
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          sentry-cli releases new "$VERSION"
          sentry-cli releases set-commits "$VERSION" --auto \
            || echo "set-commits skipped; connect the Sentry GitHub integration for suspect commits"
          sentry-cli releases finalize "$VERSION"
          sentry-cli releases deploys "$VERSION" new -e production
