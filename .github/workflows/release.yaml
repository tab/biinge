name: Release
on:
  release:
    types: [ released ]
env:
  IMAGE_NAME: biinge-api
  VERSION: ${{ github.event.release.tag_name }}
jobs:
  linter:
    name: Linter
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.3
          working-directory: api

  tests:
    name: Tests
    permissions:
      contents: read
    env:
      GO_ENV: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biinge-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d biinge-test -f db/schema.sql
      - name: Test
        run: make test:race

  build:
    name: Build
    needs: [linter, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: api
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
      - name: Notes
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true

  migrate:
    name: Migrate
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    env:
      GO_ENV: production
      DATABASE_DSN: ${{ secrets.DATABASE_DSN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install
        run: command -v goose || go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: Migrate
        run: make db:migrate
      - name: Status
        run: make db:migrate:status

  deploy:
    name: Deploy
    needs: migrate
    runs-on: self-hosted
    steps:
      - name: Login
        run: echo "${{ secrets.DEPLOY_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull
        run: docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
      - name: Restart
        run: docker compose -f "${{ secrets.COMPOSE_PATH }}" up -d biinge-api

  docs:
    name: Docs
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: npm run build
      - name: CNAME
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: echo "${SITE_URL#*://}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
      - id: deployment
        uses: actions/deploy-pages@v5

  sentry:
    name: Sentry
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Create
        run: sentry-cli releases new "$VERSION"
      - name: Commits
        continue-on-error: true
        run: sentry-cli releases set-commits "$VERSION" --auto
      - name: Finalize
        run: sentry-cli releases finalize "$VERSION"
      - name: Deploy
        run: sentry-cli releases deploys "$VERSION" new -e production
