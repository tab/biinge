components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthSerializer:
      type: object
      properties:
        result:
          type: string
          description: "Health check result"
          example: "alive"
      required:
        - result

    ErrorSerializer:
      type: object
      properties:
        error:
          type: string
          description: "Error message describing what went wrong"
      required:
        - error

    RegistrationRequest:
      type: object
      properties:
        login:
          type: string
          description: "User login name"
          minLength: 3
          maxLength: 20
        email:
          type: string
          format: email
          description: "User email address"
        password:
          type: string
          description: "User password"
          minLength: 8
        first_name:
          type: string
          description: "User's first name"
          minLength: 2
          maxLength: 20
        last_name:
          type: string
          description: "User's last name"
          minLength: 2
          maxLength: 20
        appearance:
          type: string
          description: "User's preferred appearance theme"
          enum: [light, dark, system]
      required:
        - login
        - email
        - password
        - first_name
        - last_name

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "User email address"
        password:
          type: string
          description: "User password"
          minLength: 8
      required:
        - email
        - password

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: "A valid (unexpired) refresh token"
      required:
        - refresh_token

    StatsResponse:
      type: object
      description: "Aggregate watch statistics for the current user"
      properties:
        period:
          type: string
          enum: [week, month, year, all]
          description: "Calendar period the watched stats and activity cover"
          example: "all"
        movies:
          type: object
          properties:
            want:
              type: integer
              format: int64
            watched:
              type: integer
              format: int64
            minutes:
              type: integer
              format: int64
              description: "Total watched movie runtime in minutes"
          required:
            - want
            - watched
            - minutes
        series:
          type: object
          properties:
            want:
              type: integer
              format: int64
            watching:
              type: integer
              format: int64
            watched:
              type: integer
              format: int64
          required:
            - want
            - watching
            - watched
        episodes:
          type: object
          properties:
            watched:
              type: integer
              format: int64
            minutes:
              type: integer
              format: int64
              description: "Total watched episode runtime in minutes"
          required:
            - watched
            - minutes
        activity:
          type: array
          description: "Watched runtime per bucket over the period, split by media kind. Buckets are dense, ordered oldest first and span the whole calendar period, so the rest of an unfinished period comes back as zeroes: 7 days for week, every day of the month for month, 12 months for year, and one bucket per year since the first watch for all"
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: "Start of the bucket in YYYY-MM-DD format"
                example: "2026-01-01"
              movieMinutes:
                type: integer
                format: int64
                description: "Total watched movie runtime in that bucket, in minutes"
              tvMinutes:
                type: integer
                format: int64
                description: "Total watched episode runtime in that bucket, in minutes"
            required:
              - date
              - movieMinutes
              - tvMinutes
      required:
        - period
        - movies
        - series
        - episodes
        - activity

    UpdateAccountRequest:
      type: object
      properties:
        first_name:
          type: string
          description: "User's first name"
          minLength: 2
          maxLength: 20
        last_name:
          type: string
          description: "User's last name"
          minLength: 2
          maxLength: 20
        appearance:
          type: string
          description: "User's preferred appearance theme"
          enum: [light, dark, system]
      required:
        - first_name
        - last_name
        - appearance

    CreateMovieRequest:
      type: object
      properties:
        tmdbId:
          type: integer
          description: "TMDB ID of the movie"
          format: int64
        title:
          type: string
          description: "Movie title"
        posterPath:
          type: string
          description: "Path to movie poster image"
        state:
          type: string
          description: "Watch state of the movie"
          enum: [want, watched]
      required:
        - tmdbId
        - title
        - state

    UpdateMovieRequest:
      type: object
      properties:
        state:
          type: string
          description: "Watch state of the movie"
          enum: [want, watched]
        pinned:
          type: boolean
          description: "Whether the movie is pinned"
      required:
        - state
        - pinned

    UserSerializer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "User's unique ID"
        login:
          type: string
          description: "User login name"
        email:
          type: string
          format: email
          description: "User email address"
        first_name:
          type: string
          description: "User's first name"
        last_name:
          type: string
          description: "User's last name"
        appearance:
          type: string
          description: "User's preferred appearance theme"
          enum: [light, dark, system]
      required:
        - id
        - login
        - email
        - appearance

    TokenSerializer:
      type: object
      properties:
        access_token:
          type: string
          description: "JWT access token"
        refresh_token:
          type: string
          description: "JWT refresh token"
      required:
        - access_token
        - refresh_token

    MovieSerializer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "TMDB ID"
        movieId:
          type: string
          format: uuid
          description: "Cache ID"
        tmdbId:
          type: integer
          format: int64
          description: "TMDB ID"
        imdbId:
          type: string
          description: "IMDB ID"
        title:
          type: string
          description: "Movie title"
        posterPath:
          type: string
          description: "Path to movie poster image"
        pinned:
          type: boolean
          description: "Whether the movie is pinned"
        status:
          type: string
          description: "Status of the movie"
      required:
        - id
        - movieId
        - tmdbId
        - title
        - posterPath
        - pinned

    MovieDetailsSerializer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "TMDB ID"
        movieId:
          type: string
          format: uuid
          description: "Cache ID"
        tmdbId:
          type: integer
          format: int64
          description: "TMDB ID"
        imdbId:
          type: string
          description: "IMDB ID"
        title:
          type: string
          description: "Movie title"
        posterPath:
          type: string
          description: "Path to movie poster image"
        pinned:
          type: boolean
          description: "Whether the movie is pinned"
        state:
          type: string
          description: "Watch state (want/watched)"
          enum: [want, watched]
        overview:
          type: string
          description: "Movie overview/description"
        status:
          type: string
          description: "Movie status (e.g., Released)"
        releaseDate:
          type: string
          format: date
          description: "Release date of the movie"
        runtime:
          type: integer
          description: "Runtime in minutes"
        rating:
          type: number
          format: float
          description: "Average rating"
        credits:
          type: object
          description: "Movie credits (cast and crew)"
        recommendations:
          type: object
          description: "Movie recommendations"
        videos:
          type: object
          description: "Movie videos"
      required:
        - id
        - tmdbId
        - title
        - pinned
        - overview

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: "Current page number"
        per:
          type: integer
          description: "Number of items per page"
        total:
          type: integer
          description: "Total number of items"
      required:
        - page
        - per
        - total

    MovieListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MovieSerializer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta

    SeriesSerializer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "TMDB ID"
        title:
          type: string
          description: "Series title"
        posterPath:
          type: string
          description: "Path to series poster image"
        pinned:
          type: boolean
          description: "Whether the series is pinned"
        state:
          type: string
          description: "Watch state"
          enum: [want, watching, watched]
        episodesCount:
          type: integer
          format: int64
          description: "Total number of episodes (from TMDB)"
        watchedEpisodesCount:
          type: integer
          format: int64
          description: "Number of episodes the user has marked watched"
      required:
        - id
        - title
        - posterPath
        - pinned
        - state

    SeriesDetailsSerializer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "TMDB ID"
        imdbId:
          type: string
          description: "IMDB ID"
        title:
          type: string
          description: "Series title"
        posterPath:
          type: string
          description: "Path to series poster image"
        pinned:
          type: boolean
          description: "Whether the series is pinned"
        state:
          type: string
          description: "Watch state"
          enum: [want, watching, watched, none]
        overview:
          type: string
          description: "Series overview/description"
        status:
          type: string
          description: "Series status (e.g., Ended, Returning Series)"
        releaseDate:
          type: string
          format: date
          description: "First air date"
        seasonsCount:
          type: integer
          format: int64
          description: "Number of seasons"
        episodesCount:
          type: integer
          format: int64
          description: "Number of episodes"
        rating:
          type: number
          format: float
          description: "Average rating"
        credits:
          type: array
          description: "Series credits (cast and crew)"
          items:
            type: object
        recommendations:
          type: array
          description: "Series recommendations"
          items:
            type: object
        videos:
          type: array
          description: "Series videos"
          items:
            type: object
        seasons:
          type: array
          description: "Season summaries (from TMDB)"
          items:
            $ref: "#/components/schemas/SeasonSummarySerializer"
      required:
        - id
        - title
        - pinned
        - state
        - overview

    CreateSeriesRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "TMDB ID of the series"
        title:
          type: string
          description: "Series title"
        posterPath:
          type: string
          description: "Path to series poster image"
        seasonsCount:
          type: integer
          format: int64
          description: "Number of seasons"
        episodesCount:
          type: integer
          format: int64
          description: "Number of episodes"
        status:
          type: string
          description: "Series status from TMDB"
        state:
          type: string
          description: "Watch state"
          enum: [want, watching, watched]
      required:
        - id
        - title
        - state

    UpdateSeriesRequest:
      type: object
      properties:
        state:
          type: string
          description: "Watch state"
          enum: [want, watching, watched]
        pinned:
          type: boolean
          description: "Whether the series is pinned"
      required:
        - state
        - pinned

    SeriesListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeriesSerializer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta

    ProgressResponse:
      type: object
      description: "Watched-progress snapshot for a series"
      properties:
        id:
          type: integer
          format: int64
          description: "Series TMDB ID"
        state:
          type: string
          description: "Derived series state"
          enum: [want, watching, watched, none]
        watchedSeasons:
          type: array
          description: "TMDB ids of seasons currently marked watched"
          items:
            type: integer
            format: int64
        watchedEpisodes:
          type: array
