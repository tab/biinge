openapi: "3.0.0"
info:
  title: "Biinge API"
  version: "1.0.0"
  description: "Biinge API for movie tracking and user management"
servers:
  - url: "http://localhost:8080"
    description: "Development server"

paths:
  /live:
    get:
      summary: "Liveness check"
      description: "Checks if the application is alive"
      tags:
        - health
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSerializer"

  /ready:
    get:
      summary: "Readiness check"
      description: "Checks if the application is ready to accept requests"
      tags:
        - health
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSerializer"
        "503":
          description: "Service Unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/users/registrations:
    post:
      summary: "Register a new user"
      description: "Creates a new user account"
      tags:
        - users
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/users/sessions:
    post:
      summary: "Login"
      description: "Authenticates a user and returns access tokens"
      tags:
        - users
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/users/tokens:
    post:
      summary: "Refresh access token"
      description: "Exchanges a valid refresh token for a new access + refresh token pair"
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/accounts/stats:
    get:
      summary: "Account statistics"
      description: "Aggregate watch stats for the current user: counts by list plus total watched runtime in minutes. Watched counts, minutes and activity cover the requested period; want and watching counts are always all-time"
      tags:
        - accounts
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year, all]
            default: all
          description: "Calendar period for watched stats and activity: the current week (monday to sunday), month (1st to the last day), year (january to december) or the whole history. Unknown values fall back to all"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/accounts/me:
    get:
      summary: "Get current user"
      description: "Retrieves the current user's information"
      tags:
        - accounts
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/accounts:
    patch:
      summary: "Update account"
      description: "Updates the current user's account information"
      tags:
        - accounts
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/movies:
    get:
      summary: "Movies list"
      description: "Retrieves a paginated list of movies the user watched or wants to watch"
      tags:
        - movies
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
        - name: type
          in: query
          schema:
            type: string
            default: "want"
            enum: [want, watched]
          description: "List type: 'want' for want to watch, 'watched' for watched movies"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: "Page number for pagination"
        - name: per
          in: query
          schema:
            type: integer
            default: 24
          description: "Number of items per page"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieListResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

    post:
      summary: "Create movie"
      description: "Adds a movie to the user's list"
      tags:
        - movies
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetailsSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/movies/{id}:
    get:
      summary: "Get movie details"
      description: "Retrieves details for a specific movie"
      tags:
        - movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Movie ID from TMDB"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetailsSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

    patch:
      summary: "Update movie"
      description: "Updates a movie status and pinned state"
      tags:
        - movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Movie ID from TMDB"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMovieRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetailsSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

    delete:
      summary: "Delete movie"
      description: "Deletes a movie from user's lists"
      tags:
        - movies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Movie ID from TMDB"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/series:
    get:
      summary: "Series list"
      description: "Retrieves a paginated list of TV series the user is tracking"
      tags:
        - series
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
        - name: type
          in: query
          schema:
            type: string
            default: "want"
            enum: [want, watching, watched]
          description: "List type: 'want', 'watching', or 'watched'"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: "Page number for pagination"
        - name: per
          in: query
          schema:
            type: integer
            default: 24
          description: "Number of items per page"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesListResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

    post:
      summary: "Create series"
      description: "Adds a TV series to the user's list"
      tags:
        - series
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetailsSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/series/{id}:
    get:
      summary: "Get series details"
      description: "Retrieves details for a specific series from TMDB, merged with the user's tracked state"
      tags:
        - series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetailsSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

    patch:
      summary: "Update series"
      description: "Updates a series watch state and pinned flag"
      tags:
        - series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeriesRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetailsSerializer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

    delete:
      summary: "Delete series"
      description: "Removes a series from the user's lists"
      tags:
        - series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique request identifier"
        - name: X-Trace-ID
          in: header
          schema:
            type: string
            format: uuid
          description: "Unique trace identifier"
      security:
        - BearerAuth: []
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/series/{id}/progress:
    get:
      summary: "Get series watched progress"
      description: "Returns the TMDB ids of the seasons and episodes currently marked watched for a series, plus its derived state"
      tags:
        - progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/series/{id}/watched:
    post:
      summary: "Mark whole show watched"
      description: "Marks the series and all provided seasons and episodes as watched in a single transaction; the series state is derived (watched, or watching if still in production)"
      tags:
        - progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkShowRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
    delete:
      summary: "Unmark whole show watched"
      description: "Removes the series and cascades deletion of its seasons and episodes; returns an empty (none) progress snapshot"
      tags:
        - progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"

  /api/v1/series/{id}/seasons/{seasonId}/watched:
    post:
      summary: "Mark season watched"
      description: "Marks a season and all provided episodes as watched, then recomputes the series state"
      tags:
        - progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
          description: "Season ID from TMDB"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkSeasonRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
    delete:
      summary: "Unmark season watched"
      description: "Deletes a season (cascading its episodes), then recomputes the series state"
      tags:
        - progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
          description: "Season ID from TMDB"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
