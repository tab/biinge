      summary: "Mark episode watched"
      description: "Marks a single episode watched, upserting its parent series and season, then recomputes the season and series state"
      tags:
        - progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Series ID from TMDB"
        - name: seasonId
          in: path
