        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
        "422":
          description: "Unprocessable Entity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorSerializer"
    delete:
      summary: "Unmark episode watched"
      description: "Deletes a single watched episode, then recomputes the season and series state (untracking the show once it has no watched episodes left)"
      tags:
