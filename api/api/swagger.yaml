            type: string
          description: "Season ID from TMDB"
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
          description: "Episode ID from TMDB"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkEpisodeRequest"
      responses:
        "200":
          description: "OK"
          content:
