version: 2
sql:
  - name: postgresql
    engine: postgresql
    schema: db/schema.sql
    queries:
      - db/sqlc/health.sql
      - db/sqlc/games.sql
      - db/sqlc/movies.sql
      - db/sqlc/series.sql
      - db/sqlc/seasons.sql
      - db/sqlc/episodes.sql
      - db/sqlc/stats.sql
      - db/sqlc/users.sql
    gen:
      go:
        package: db
        sql_package: pgx/v5
        out: internal/app/repositories/db
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: false
            nullable: true

          - column: "games.igdb_id"
            go_type: "uint64"
          - column: "games.poster_path"
            go_type: "string"
            nullable: true
          - column: "games.runtime"
            go_type: "uint64"

          - column: "movies.tmdb_id"
            go_type: "uint64"
          - column: "movies.poster_path"
            go_type: "string"
            nullable: true
          - column: "movies.runtime"
            go_type: "uint64"

          - column: "series.tmdb_id"
            go_type: "uint64"
          - column: "series.poster_path"
            go_type: "string"
            nullable: true
          - column: "series.seasons_count"
            go_type: "uint64"
          - column: "series.episodes_count"
            go_type: "uint64"

          - column: "seasons.tmdb_id"
            go_type: "uint64"
          - column: "seasons.number"
            go_type: "uint64"
          - column: "seasons.episodes_count"
            go_type: "uint64"

          - column: "episodes.tmdb_id"
            go_type: "uint64"
          - column: "episodes.poster_path"
            go_type: "string"
            nullable: true
          - column: "episodes.runtime"
            go_type: "uint64"
