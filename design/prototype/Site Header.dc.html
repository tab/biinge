<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&amp;display=block"><style>@font-face{font-family:"Archivo";src:url("../../docs/public/fonts/archivo-latin-var.woff2") format("woff2-variations");font-weight:100 900;font-display:swap}</style></helmet>
<div data-media="{{ media }}" style="position:{{ pos }};top:0;left:0;right:0;z-index:50;background:{{ bg }};backdrop-filter:{{ blur }};-webkit-backdrop-filter:{{ blur }};box-shadow:{{ line }};font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;">
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(20px,5cqw,64px);height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
    <div style="display:flex;align-items:center;gap:36px;">
      <a href="Site%20Home.dc.html" style="display:flex;align-items:center;gap:10px;color:#f4f4f2;text-decoration:none;">
        <img src="../../docs/public/icon.png" alt="" style="width:28px;height:28px;border-radius:7px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.12);">
        <span style="font-family:Archivo,-apple-system,sans-serif;font-weight:640;font-size:19px;letter-spacing:-.028em;">biinge</span>
      </a>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <nav style="display:flex;align-items:center;gap:4px;">
          <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" style="padding:7px 12px;border-radius:8px;font-size:14.5px;font-weight:{{ l.weight }};color:{{ l.color }};text-decoration:none;" style-hover="color:#f4f4f2;">{{ l.label }}</a>
          </sc-for>
        </nav>
      </sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button onClick="{{ toggle }}" aria-label="Switch theme" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#f4f4f2;cursor:pointer;" style-hover="background:rgba(255,255,255,.18);"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;">{{ themeIcon }}</span></button>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <a href="https://github.com/tab/biinge" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;height:36px;padding:0 18px;border-radius:999px;background:#f4f4f2;color:#101014;font-size:14px;font-weight:600;text-decoration:none;">GitHub<span style="font-family:'Material Symbols Rounded';font-size:17px;line-height:1;">north_east</span></a>
      </sc-if>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button aria-label="Menu" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#f4f4f2;cursor:pointer;"><span style="font-family:'Material Symbols Rounded';font-size:21px;line-height:1;">menu</span></button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;iphone&quot;,&quot;mac&quot;,&quot;tv&quot;,&quot;about&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;over&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggleTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, over = !!p.over, narrow = !!p.narrow, page = p.page ?? 'home';
    const defs = [['iphone', 'iPhone', 'Site%20iPhone.dc.html'], ['mac', 'Mac', 'Site%20Mac.dc.html'], ['tv', 'Apple TV', 'Site%20Apple%20TV.dc.html'], ['about', 'About', 'Site%20About.dc.html']];
    return {
      media: over ? '' : undefined,
      pos: 'relative',
      bg: over ? 'linear-gradient(180deg,rgba(16,16,20,.7) 0%,rgba(16,16,20,0) 100%)' : 'rgba(16,16,20,.82)',
      blur: over ? 'none' : 'blur(18px) saturate(1.6)',
      line: over ? 'none' : 'inset 0 -1px 0 rgba(255,255,255,.08)',
      wide: !narrow, narrow,
      links: defs.map(([k, label, href]) => ({ label, href, weight: k === page ? 600 : 450, color: k === page ? '#f4f4f2' : 'rgba(244,244,242,.66)' })),
      themeIcon: (p.theme ?? 'dark') === 'light' ? 'dark_mode' : 'light_mode',
      toggle: () => p.onToggleTheme && p.onToggleTheme(),
    };
  }
}
</script>
</body>
</html>
