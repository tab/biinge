  <text x="520" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="130" font-weight="700" letter-spacing="-5" fill="#ffffff">biinge</text>
  <g transform="translate(524 370)">
